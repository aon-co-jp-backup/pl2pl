name: test

# push・PR のたびに、単体テストと PHP → FastAPI の通し試験(実 FastAPI・SQLite・Jinja2)を動かす。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust ツールチェーン
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Linux の GUI 依存(取り込んだ cobol_to のビルドに必要)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: ビルドと単体テスト
        run: |
          cargo build --release
          cargo test --release
          cargo test --release --manifest-path converters/cobol_to/Cargo.toml
          cargo test --release --manifest-path converters/java_to/Cargo.toml
      - name: PHP 通し試験の Python 環境
        run: |
          python3 -m venv "$HOME/2fa-venv"
          "$HOME/2fa-venv/bin/pip" install --quiet fastapi httpx sqlalchemy jinja2
      - name: PHP → FastAPI の通し試験
        run: B="$PWD/target/release/pl2pl" bash tests/run-php.sh
