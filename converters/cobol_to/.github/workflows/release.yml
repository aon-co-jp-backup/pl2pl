name: release
# タグ v* を push すると、各OSのインストーラーを作って GitHub Release に添付する。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" } else { (Get-Command iscc).Source }
          $ver = "${{ github.ref_name }}".TrimStart('v'); if ($ver -notmatch '^\d') { $ver = "0.0.0" }
          & $iscc /Q "/DAppVersion=$ver" "/DArch=${{ matrix.arch }}" "/DExeDir=..\target\${{ matrix.target }}\release" installer\cobol_to.iss
      - name: Smoke test (install, run, uninstall)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\ct"
          Start-Process dist\COBOL_to-Setup-${{ matrix.arch }}.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$d" -Wait
          & "$d\cobol_to.exe" --src tests\samples --target rust-poem --out "$env:RUNNER_TEMP\out"
          if (-not (Test-Path "$env:RUNNER_TEMP\out\src\programs\hello.rs")) { throw "conversion failed" }
          Start-Process "$d\unins000.exe" -ArgumentList "/VERYSILENT" -Wait
          if (Test-Path $d) { throw "uninstall left files" }
      - uses: actions/upload-artifact@v4
        with: { name: "win-${{ matrix.arch }}", path: dist/*.exe }

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies (rfd needs wayland headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"; case "$ver" in [0-9]*) ;; *) ver=0.0.0;; esac
          bash installer/build-deb.sh target/release/cobol_to "$ver" ${{ matrix.arch }} dist
          tar czf "dist/cobol_to-$ver-linux-${{ matrix.arch }}.tar.gz" -C target/release cobol_to -C ../.. README.md NOTIFY.md LICENSE
      - name: Smoke test (install, run, remove)
        run: |
          sudo dpkg -i dist/*.deb
          cobol_to --src tests/samples --target rpoem --out "$RUNNER_TEMP/out" </dev/null
          test -f "$RUNNER_TEMP/out/src/programs/hello.rs"
          sudo dpkg -r cobol-to
          hash -r; test ! -e /usr/bin/cobol_to
      - uses: actions/upload-artifact@v4
        with: { name: "linux-${{ matrix.arch }}", path: "dist/*" }

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, arch: x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (.pkg, unsigned)
        run: |
          ver="${GITHUB_REF_NAME#v}"; case "$ver" in [0-9]*) ;; *) ver=0.0.0;; esac
          bash installer/build-pkg.sh target/${{ matrix.target }}/release/cobol_to "$ver" ${{ matrix.arch }} dist
      - name: Smoke test (install, run)
        run: |
          sudo installer -pkg dist/*.pkg -target /
          /usr/local/bin/cobol_to --src tests/samples --target rpoem --out "$RUNNER_TEMP/out" </dev/null
          test -f "$RUNNER_TEMP/out/src/programs/hello.rs"
      - uses: actions/upload-artifact@v4
        with: { name: "macos-${{ matrix.arch }}", path: dist/*.pkg }

  publish:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: SHA-256 と Release 作成
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd out && sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "OS別インストーラー / installers per OS. SHA-256: SHA256SUMS.txt" *
